<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/Users/wenxun/Desktop/Navicat Premium Lite.app/Contents/Resources/fonts</dir>
  <dir>/Users/wenxun/Library/Application Support/TRAE SOLO CN/ModularData/ai-agent/vm/tools/share/fonts/opentype/noto-cjk</dir>
  <cachedir>/tmp/taxrisk-fontconfig-cache</cachedir>
  <match target="pattern">
    <test qual="any" name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>楷体</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans CJK SC</string></edit>
  </match>
</fontconfig>
